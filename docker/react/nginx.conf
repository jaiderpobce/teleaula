server {
    listen 80;
    server_name localhost;

    # Permitir subida de archivos de hasta 64MB (PDFs, guías, tareas)
    client_max_body_size 64M;

    # Proxy inverso hacia el backend Spring Boot
    location /api/ {
        proxy_pass http://teleaula_backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Proxy inverso para archivos y recursos subidos (PDFs, guías)
    location /uploads/ {
        proxy_pass http://teleaula_backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64M;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache estático para assets compilados
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
