spring.application.name=teleaula_back
server.port=8080

# CONFIGURACIÓN MARIADB (Conexión principal a teleaula_db)
spring.datasource.url=jdbc:mariadb://${DB_HOST:db-mariadb}:${DB_PORT:3306}/teleaula_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:teleaula_user}
spring.datasource.password=${DB_PASSWORD:teleaula_password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# CARGA DE ARCHIVOS (PDFs, GUÍAS, TAREAS)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
teleaula.upload.dir=${UPLOAD_DIR:/app/uploads}

# DEVTOOLS HOT-RELOAD
spring.devtools.restart.enabled=true
